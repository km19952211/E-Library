<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js"> </script>
</head>
<body>
<header>
    <h1>E-Library System</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html" class="active">Login / Register</a>
        <a href="search.html">Search Books</a>
        <a href="history.html">Borrow History</a>
    </nav>
</header>

<main>
    <section class="form-section">
        <h2>Login</h2>
        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>

            <button type="submit" class="btn">Login</button>
        </form>

        <h3>Don’t have an account?</h3>
        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Create a password" required>

            <button type="submit" class="btn secondary">Register</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2025 E-Library. All Rights Reserved.</p>
</footer>
</body>
</html>
