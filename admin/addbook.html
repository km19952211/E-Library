<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة كتاب | E-Library</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <h1>E-Library</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="search.html">بحث عن كتاب</a>
      <a href="history.html">سجل الاستعارة</a>
      <a href="login.html">تسجيل الدخول</a>
      <a href="addBook.html" class="active">إضافة كتاب</a>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main>
    <section class="form-section">
      <h2>إضافة كتاب جديد</h2>

      <form id="addBookForm">
        <label for="title">عنوان الكتاب</label>
        <input type="text" id="title" placeholder="أدخل عنوان الكتاب" required>

        <label for="author">المؤلف</label>
        <input type="text" id="author" placeholder="أدخل اسم المؤلف" required>

        <label for="genre">التصنيف</label>
        <input type="text" id="genre" placeholder="أدخل نوع الكتاب (خيال، علمي، تاريخ...)" required>

        <label for="year">سنة النشر</label>
        <input type="number" id="year" placeholder="مثال: 2022">

        <button type="submit" class="btn">إضافة الكتاب</button>
      </form>

      <div id="responseMsg" style="margin-top:20px; text-align:center; font-weight:bold;"></div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>جميع الحقوق محفوظة © E-Library 2025</p>
  </footer>



</body>
</html>
