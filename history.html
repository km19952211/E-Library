<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Borrow History</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/history.js" defer></script>
</head>

<body>

<header>
    <h1>E-Library System</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login / Register</a>
        <a href="search.html">Search Books</a>
        <a href="history.html" class="active">Borrow History</a>
    </nav>
</header>

<main>
    <section class="history-section">
        <h2>Your Borrow History</h2>

        <!-- رسالة إذا ما عنده استعارات -->
        <div id="noBooks" class="no-books" style="display:none;">
            <p style="font-size:1.1em; color:#4a3d33; margin-bottom:15px;">
                You currently have no borrowed books.
            </p>
            <a href="search.html" class="btn">Browse Books</a>
        </div>

        <!-- الجدول -->
        <table id="historyTable" style="display:none;">
            <thead>
                <tr>
                    <th>Book Title</th>
                    <th>Borrow Date</th>
                    <th>Return Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="historyBody"></tbody>
        </table>

    </section>
</main>

<footer>
    <p>&copy; 2025 E-Library. All Rights Reserved.</p>
</footer>

</body>
</html>
